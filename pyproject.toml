[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uzal"
version = "1.0.0"
description = "Cost function of Uzal, Grinblat & Verdes (2011), Phys. Rev. E 84, 016223"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maximilian Seeger" }]
keywords = [
    "nonlinear time series analysis",
    "state space reconstruction",
    "delay embedding",
    "noise amplification",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# The library and all 148 tests run on numpy alone; matplotlib is needed only
# by the scripts under demo/.
demo = ["matplotlib"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/CodingatMaxspeed/uzal-noise-amplification"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
